<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060" role="img" aria-labelledby="title desc">
<title id="title">How IC Query answers your question</title>
<desc id="desc">Your question. ic-query chooses the relevant official source. It checks and labels the information. You receive a readable answer with its source, retrieval time and important limitations.</desc>

<rect x="650" y="490" width="702" height="94" rx="14" fill="#F0FBFD" stroke="#A2DCE5" stroke-width="1.5"/>
<text x="678" y="546" font-size="23" font-weight="600">SNS canisters</text>
<rect x="88" y="608" width="414" height="94" rx="14" fill="#102B50"/>

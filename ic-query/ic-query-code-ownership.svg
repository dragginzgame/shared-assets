<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="570" viewBox="0 0 1440 570" role="img" aria-labelledby="title desc">
<title id="title">IC Query code ownership pipeline</title>
<desc id="desc">Five ownership stages in order: parsing, runtime, report, source and cache, then model and rendering. Source and cache share one stage; model and rendering share the final stage. This overview follows the documented ownership pipeline without detailing individual modules.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71859A"/></marker></defs>

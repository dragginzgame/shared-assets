<g font-family="Inter, Arial, sans-serif" fill="#102B50">
<text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC QUERY · CODE OWNERSHIP</text>
<text x="56" y="107" font-size="34" font-weight="700">The ownership pipeline, at a glance</text>
<text x="56" y="143" font-size="19" fill="#53718F">Five stages, with clear responsibility boundaries.</text>
<rect x="56" y="182" width="1328" height="316" rx="22" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
<circle cx="192" cy="232" r="17" fill="#EDF3F9"/>

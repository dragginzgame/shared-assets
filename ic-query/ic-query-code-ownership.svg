<text x="192" y="357" text-anchor="middle" font-size="26" font-weight="700" fill="#102B50">Parsing</text>
<path d="M314 348H334" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="462" cy="232" r="17" fill="#F0FBFD"/>
<text x="462" y="238" text-anchor="middle" font-size="17" font-weight="700" fill="#087C94">2</text>
<rect x="350" y="273" width="224" height="150" rx="16" fill="#F0FBFD" stroke="#009DBD" stroke-width="1.5"/>
<text x="462" y="357" text-anchor="middle" font-size="26" font-weight="700" fill="#087C94">Runtime</text>
<path d="M584 348H604" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="732" cy="232" r="17" fill="#F5F1FD"/>
<text x="732" y="238" text-anchor="middle" font-size="17" font-weight="700" fill="#7354C6">3</text>
<rect x="620" y="273" width="224" height="150" rx="16" fill="#F5F1FD" stroke="#7354C6" stroke-width="1.5"/>
<text x="732" y="357" text-anchor="middle" font-size="26" font-weight="700" fill="#7354C6">Report</text>
<path d="M854 348H874" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="1002" cy="232" r="17" fill="#EDF3F9"/>
<text x="1002" y="238" text-anchor="middle" font-size="17" font-weight="700" fill="#102B50">4</text>
<rect x="890" y="273" width="224" height="150" rx="16" fill="#EDF3F9" stroke="#A9BED3" stroke-width="1.5"/>
<path d="M910 348H1094" stroke="#A9BED3" stroke-width="1.5"/>
